name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install workspace
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test (headless engine, parser, controller)
        run: bun test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test WASM kernels (native)
        working-directory: packages/cytometry-wasm
        run: cargo test
      - name: Build for wasm32 with SIMD
        run: |
          rustup target add wasm32-unknown-unknown
          cd packages/cytometry-wasm
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build --release --target wasm32-unknown-unknown
